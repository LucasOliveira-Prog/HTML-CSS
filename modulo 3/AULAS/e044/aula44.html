<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização de fundos</title>

    <style>
        body {
            /*
            repeat = repete a imagem (é o padrão)
            no-repeat = não repete a imagem
            repeat-x = repete a imagem somente na horizontal
            repeat-y = repete a imagem somente na vertical

            a imagem começa SEMPRE no canto superior esquerdo!
            */
            background-image: url(imgs/wallpaper001.jpg);
            background-size: 100px;
            background-repeat: repeat-y;
        }


    </style>

</head>
<body>
    <h1>Teste de aplicação de fundo</h1>
</body>
</html>
