<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferetnes ou simplesmente aumente e diminui o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imgs/Pequeno.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imgs/Medio.png" type="image/png">
        <img src="imgs/Grande.png" alt="Imagem flexivel">
    </picture>
</body>
</html>
