<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferetnes ou simplesmente aumente e diminui o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imgs/Pequeno.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imgs/Medio.png" type="image/png">
        <img src="imgs/Grande.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5</p>
    <audio preload="none" controls autoplay loop>
        <source src="midia/audio.mp3" type="audio/mpeg">
        <source src="midia/audio.ogg" type="auido/ogg">
        <source src="midia/audio.wav" type="auido/wav"> <!-- Evitar arquivos wav por serem MUITO pesados -->
        <p>infelizmente seu navegador não consegue reproduzir audio.
        <a href="midia/audio.mp3">
            Clique aqui para baixar o audio
        </a>
        </p>
    </audio>
    <!-- MP3 / MAV / OGG-->
</body>
</html>
