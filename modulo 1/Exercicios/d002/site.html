<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>

    <p>Em HTML5, podemos inserir os elementos da lista e seguir. Passeo mouse sobre os termospara descobrir qual tag deverá utilizar em cada casa:</p>
    
    <ul type="square">
        <li>
            <abbr title="Use a tag &lt;P&gt;">
                Parágrafos
            </abbr>
        </li>

        <li>
            <abbr title="Use a tag &lt;h1&gt; até &lt;h6&gt;">
                Titulos
            </abbr>
        </li>

        <li>
            <abbr title="Use a tag &lt;img&gt;">
                Imagems
            </abbr>
        </li>

        <li>
            <abbr title="Use a tag &lt;abbr&gt;">
                Abreviações
            </abbr>
        </li>

        <li>
            <abbr title="Use a tag &lt;code&gt;">
                Codigos-fonte
            </abbr>
        </li>
        
        <li>
            <abbr title="Use a tag &lt;ol&gt;">
                Listas numeradas
            </abbr>
        </li>

        <li>
            <abbr title="Use a tag &lt;ul&gt;">
                Listas com demarcadores
            </abbr>
        </li>
    </ul>
</body>
</html>
