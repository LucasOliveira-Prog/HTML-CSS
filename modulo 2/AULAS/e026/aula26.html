<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient em CSS</title>
    <style>
        * { /* Configurações globais das css */
            height: 100%;
        }

        body {
            background-image: linear-gradient(to right, rgb(0, 60, 255), rgb(223, 255, 42), blue);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testadno Gradiante</h1>
</body>/
</html>
